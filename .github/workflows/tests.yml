name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '10.*', testbench: '8.*',  php: '8.1' }
          - { laravel: '10.*', testbench: '8.*',  php: '8.3' }
          - { laravel: '11.*', testbench: '9.*',  php: '8.2' }
          - { laravel: '11.*', testbench: '9.*',  php: '8.4' }
          - { laravel: '12.*', testbench: '10.*', php: '8.2' }
          - { laravel: '12.*', testbench: '10.*', php: '8.4' }
          - { laravel: '13.*', testbench: '11.*', php: '8.3' }
          - { laravel: '13.*', testbench: '11.*', php: '8.4' }

    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 10 and 11 are end-of-life with open advisories; Composer blocks them by default.
          composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
